name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout existing gh-pages (to preserve PDFs)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-current

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build (EPUBs + HTML + PDFs)
        run: |
          ./mvnw clean install -B
          # Copy static site assets (index.html, CSS, JS) — src/site/ wins over gh-pages-current
          cp -r src/site/. target/site/
          # Inject build date and commit SHA into index.html footer
          BUILD_DATE=$(date -u '+%d %B %Y')
          COMMIT_SHA=$(git rev-parse HEAD)
          sed -i "s/@@BUILD_DATE@@/${BUILD_DATE}/g" target/site/index.html
          sed -i "s/@@COMMIT_SHA@@/${COMMIT_SHA}/g" target/site/index.html

      - name: Restore large assets from previous gh-pages
        run: |
          # Restore only large binary assets not in src/site/ (readium viewer)
          for f in readium-js-viewer; do
            if [ -e "gh-pages-current/$f" ] && [ ! -e "target/site/$f" ]; then
              cp -r "gh-pages-current/$f" "target/site/$f"
              echo "Restored: $f"
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site
          publish_branch: gh-pages
          keep_files: false
