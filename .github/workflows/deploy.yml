name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout existing gh-pages (to preserve PDFs)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-current

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build (EPUBs + HTML + PDFs)
        run: |
          ./mvnw clean install -B
          # Copy static site assets (index.html, CSS, JS) — src/site/ wins over gh-pages-current
          cp -r src/site/. target/site/
          # Inject build date and commit SHA into index.html footer
          BUILD_DATE=$(date -u '+%d %B %Y')
          COMMIT_SHA=$(git rev-parse HEAD)
          sed -i "s/@@BUILD_DATE@@/${BUILD_DATE}/g" target/site/index.html
          sed -i "s/@@COMMIT_SHA@@/${COMMIT_SHA}/g" target/site/index.html

      - name: Restore large assets from previous gh-pages
        run: |
          # Restore only large binary assets not in src/site/ (readium viewer)
          for f in readium-js-viewer; do
            if [ -e "gh-pages-current/$f" ] && [ ! -e "target/site/$f" ]; then
              cp -r "gh-pages-current/$f" "target/site/$f"
              echo "Restored: $f"
            fi
          done

      - name: Generate epubcheck compatibility reports
        run: |
          M2="${HOME}/.m2/repository"
          JAVA="${JAVA_HOME}/bin/java"
          CP="${M2}/org/idpf/epubcheck/4.0.2/epubcheck-4.0.2.jar"
          CP="${CP}:${M2}/com/google/guava/guava/23.0/guava-23.0.jar"
          CP="${CP}:${M2}/org/daisy/libs/jing/20120724.0.0/jing-20120724.0.0.jar"
          CP="${CP}:${M2}/net/sf/saxon/Saxon-HE/9.5.1-5/Saxon-HE-9.5.1-5.jar"
          CP="${CP}:${M2}/org/codehaus/jackson/jackson-core-asl/1.9.13/jackson-core-asl-1.9.13.jar"
          CP="${CP}:${M2}/org/codehaus/jackson/jackson-mapper-asl/1.9.13/jackson-mapper-asl-1.9.13.jar"
          CP="${CP}:${M2}/net/arnx/jsonic/1.3.10/jsonic-1.3.10.jar"
          CP="${CP}:${M2}/com/googlecode/juniversalchardet/juniversalchardet/1.0.3/juniversalchardet-1.0.3.jar"
          python3 scripts/generate-reports.py target/site "${JAVA}" "${CP}"

      - name: Generate archives/epubs.zip (all EPUBs + PDFs)
        run: |
          mkdir -p target/site/archives
          cd target/site
          zip -j archives/epubs.zip epub/*.epub pdf/*.pdf
          echo "Archive size: $(du -sh archives/epubs.zip | cut -f1)"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site
          publish_branch: gh-pages
          keep_files: false
