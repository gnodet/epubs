name: Preview

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, closed ]

permissions:
  contents: write

jobs:
  deploy-preview:
    # Skip forks (no write token) and skip closed PRs (handled by cleanup job)
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build (EPUBs + HTML + PDFs)
        run: |
          ./mvnw clean install -B
          cp -r src/site/. target/site/

      - name: Generate epubcheck compatibility reports
        run: |
          M2="${HOME}/.m2/repository"
          JAVA="${JAVA_HOME}/bin/java"
          CP="${M2}/org/idpf/epubcheck/4.0.2/epubcheck-4.0.2.jar"
          CP="${CP}:${M2}/com/google/guava/guava/23.0/guava-23.0.jar"
          CP="${CP}:${M2}/org/daisy/libs/jing/20120724.0.0/jing-20120724.0.0.jar"
          CP="${CP}:${M2}/net/sf/saxon/Saxon-HE/9.5.1-5/Saxon-HE-9.5.1-5.jar"
          CP="${CP}:${M2}/org/codehaus/jackson/jackson-core-asl/1.9.13/jackson-core-asl-1.9.13.jar"
          CP="${CP}:${M2}/org/codehaus/jackson/jackson-mapper-asl/1.9.13/jackson-mapper-asl-1.9.13.jar"
          CP="${CP}:${M2}/net/arnx/jsonic/1.3.10/jsonic-1.3.10.jar"
          CP="${CP}:${M2}/com/googlecode/juniversalchardet/juniversalchardet/1.0.3/juniversalchardet-1.0.3.jar"
          python3 scripts/generate-reports.py target/site "${JAVA}" "${CP}"

      - name: Determine preview path
        id: preview-path
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "path=preview/master" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ github.head_ref }}"
            SAFE=$(echo "$BRANCH" | sed 's|/|-|g' | tr -cd '[:alnum:]-_')
            echo "path=preview/${SAFE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site
          publish_branch: gh-pages
          destination_dir: ${{ steps.preview-path.outputs.path }}
          keep_files: true

      - name: Post preview URL as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const safe = branch.replace(/\//g, '-').replace(/[^a-zA-Z0-9-_]/g, '');
            const url = `https://gnodet.github.io/epubs/preview/${safe}/`;
            const marker = '<!-- epubs-preview-url -->';
            const body = `${marker}\n🔍 **Preview déployé :** ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup-preview:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          BRANCH="${{ github.head_ref }}"
          SAFE=$(echo "$BRANCH" | sed 's|/|-|g' | tr -cd '[:alnum:]-_')
          PREVIEW_DIR="preview/${SAFE}"
          if [ -d "$PREVIEW_DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PREVIEW_DIR"
            git commit -m "chore: remove preview for ${BRANCH}"
            git push
          else
            echo "No preview directory found for ${BRANCH}, nothing to clean up."
          fi
